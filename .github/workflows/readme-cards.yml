name: readme-cards

on:
  schedule: [{ cron: "40 10 * * *" }]
  workflow_dispatch:

jobs:
  cards:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - name: Generate stats card
        uses: stats-organization/github-readme-stats-action@e856fc8de9d7729b463c468911e232cfbdc3d55e # v2.0.2
        with:
          card: stats
          path: profile/stats.svg
          token: ${{ secrets.METRICS_TOKEN }}
          core_version: 2.2.0
          fail_on_error: "true"
          options: username=uhs-robert&show_icons=true&theme=ayu-mirage&include_all_commits=true&count_private=true

      - name: Generate top languages card
        uses: stats-organization/github-readme-stats-action@e856fc8de9d7729b463c468911e232cfbdc3d55e # v2.0.2
        with:
          card: top-langs
          path: profile/top-langs.svg
          token: ${{ secrets.METRICS_TOKEN }}
          core_version: 2.2.0
          fail_on_error: "true"
          options: username=uhs-robert&layout=compact&langs_count=8&theme=ayu-mirage&count_private=true

      - name: Commit cards
        run: |
          git config user.name "github-actions"
          git config user.email "github-actions@users.noreply.github.com"
          git add profile/*.svg
          git diff --cached --quiet && exit 0
          git commit -m "chore: update readme cards"
          git push
